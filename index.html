<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#fff8fb">

  <title>宝塚好き顔 9選</title>

  <style>

    :root {
      --pink: #ed5f93;
      --pink-light: #ff91b7;
      --text: #29293a;
      --muted: #858596;
      --background: #fff8fb;
      --line: #ece8ed;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;

      background:
        linear-gradient(
          #fffafd,
          #ffffff
        );

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 520px;

      margin: 0 auto;

      padding:
        12px
        12px
        34px;

      min-height: 100vh;
    }

    header {
      text-align: center;
      margin: 3px 0 8px;
    }

    h1 {
      margin: 0;

      font-size: 25px;
      font-weight: 800;

      letter-spacing: .02em;
    }

    .nine {
      color: var(--pink);
      font-size: 1.25em;
    }

    .spark {
      color: #f5aac3;
    }


    /* =========================
       進行状況
    ========================= */

    .steps {
      display: flex;
      align-items: flex-start;

      margin:
        8px
        4px
        11px;
    }

    .step {
      flex: 1;

      position: relative;

      text-align: center;

      color: #9a9aa8;

      font-size: 9px;
      font-weight: 700;
    }

    .step:not(:last-child)::before {
      content: "";

      position: absolute;

      top: 12px;
      left: 58%;

      width: 84%;
      height: 2px;

      background: #e7e4e8;
    }

    .dot {
      position: relative;
      z-index: 1;

      width: 25px;
      height: 25px;

      margin:
        0 auto
        3px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background: #e8e8ed;

      font-size: 11px;
    }

    .step.on {
      color: var(--pink);
    }

    .step.on .dot {
      color: white;
      background: var(--pink);
    }


    /* =========================
       ステージ説明
    ========================= */

    .panel {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 10px;

      padding:
        10px
        12px;

      border-radius: 14px;

      background:
        linear-gradient(
          100deg,
          #fff0f6,
          #fff7fa
        );

      box-shadow:
        0 4px 18px
        rgba(233, 140, 175, .08);
    }

    .badge {
      display: inline-block;

      padding:
        4px
        11px;

      border-radius: 999px;

      background: var(--pink);

      color: white;

      font-size: 11px;
      font-weight: 800;
    }

    .panel h2 {
      margin:
        6px
        0
        0;

      font-size: 16px;
    }

    .stats {
      text-align: right;

      font-size: 10px;

      white-space: nowrap;
    }

    .stats b {
      display: block;

      color: var(--pink);

      font-size: 18px;
    }


    /* =========================
       2 × 2 カード
    ========================= */

    .cards {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 8px;
    }

    .card {
      position: relative;

      min-width: 0;

      overflow: hidden;

      border:
        2px solid
        transparent;

      border-radius: 12px;

      background: white;

      box-shadow:
        0 4px 14px
        rgba(77, 53, 80, .07);

      transition:
        transform .12s,
        border-color .12s,
        box-shadow .12s;
    }

    .card.selected {
      border-color: var(--pink);

      transform:
        translateY(-1px);

      box-shadow:
        0 5px 18px
        rgba(237, 95, 147, .19);
    }

    .photo {
      aspect-ratio: 1 / 1.10;

      overflow: hidden;

      background: #f0edf1;
    }

    .photo img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .info {
      height: 53px;

      padding:
        5px
        4px
        4px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      text-align: center;
    }

    .group {
      font-size: 10px;
      font-weight: 800;
    }

    .name {
      margin-top: 2px;

      overflow: hidden;

      font-size: 14px;
      font-weight: 750;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .check {
      position: absolute;

      top: 6px;
      right: 6px;

      width: 25px;
      height: 25px;

      display: grid;
      place-items: center;

      border:
        1.5px solid
        #7f7f8c;

      border-radius: 50%;

      background: white;

      color: white;

      font-weight: 900;
    }

    .selected .check {
      border-color: white;
      background: var(--pink);
    }

    .selected .check::after {
      content: "✓";
    }


    /* =========================
       ボタン
    ========================= */

    .actions {
      margin-top: 11px;
    }

    .primary,
    .secondary {
      width: 100%;

      border: 0;

      border-radius: 999px;

      font-weight: 800;
    }

    .primary {
      padding:
        12px
        12px;

      background:
        linear-gradient(
          90deg,
          var(--pink-light),
          var(--pink)
        );

      color: white;

      font-size: 14px;
    }

    .primary:disabled {
      opacity: .42;
    }

    .row {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin-top: 7px;
    }

    .secondary {
      padding:
        9px
        5px;

      border:
        1px solid
        #e4dfe5;

      background: white;

      color: #737381;

      font-size: 11px;
    }

    .secondary:disabled {
      opacity: .4;
    }

    .notice {
      margin:
        9px
        0;

      text-align: center;

      color: #8a8790;

      font-size: 11px;
    }


    /* =========================
       スタート画面
    ========================= */

    .start-card {
      padding:
        18px
        14px;

      border-radius: 18px;

      background: white;

      text-align: center;

      box-shadow:
        0 6px 25px
        rgba(103, 74, 96, .08);
    }

    .start-card h2 {
      margin-top: 3px;
    }

    .start-card p {
      color: #777;

      font-size: 12px;

      line-height: 1.7;
    }

    .menu {
      display: grid;

      gap: 9px;

      margin-top: 14px;
    }


    /* =========================
       最終結果
    ========================= */

    .rank-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;
    }

    .rank-card {
      position: relative;

      overflow: hidden;

      border:
        2px solid
        transparent;

      border-radius: 12px;

      background: white;

      box-shadow:
        0 4px 14px
        rgba(77, 53, 80, .07);
    }

    .rank-card .photo {
      aspect-ratio:
        1 / 1.08;
    }

    .rank-card .info {
      height: 49px;
    }

    .rank-card .name {
      font-size: 11px;
    }

    .rank-card .group {
      font-size: 9px;
    }

    .rank-no {
      position: absolute;

      z-index: 2;

      top: 4px;
      left: 4px;

      min-width: 25px;
      height: 25px;

      display: grid;
      place-items: center;

      border-radius: 999px;

      background: white;

      font-size: 12px;
      font-weight: 900;

      box-shadow:
        0 2px 6px
        rgba(0, 0, 0, .13);
    }


    /* 1位 */

    .rank-card.gold {
      border-color: #d7ad24;

      box-shadow:
        0 0 0 2px
        rgba(255, 232, 138, .35),
        0 5px 16px
        rgba(182, 139, 38, .20);
    }

    .rank-card.gold .rank-no {
      background: #f5cf49;
    }


    /* 2位 */

    .rank-card.silver {
      border-color: #aeb6c2;
    }

    .rank-card.silver .rank-no {
      background: #dce1e7;
    }


    /* 3位 */

    .rank-card.bronze {
      border-color: #bf7a42;
    }

    .rank-card.bronze .rank-no {
      background: #d99761;
    }


    /* =========================
       順位決定
    ========================= */

    .duel-title {
      margin:
        8px
        0;

      text-align: center;

      font-size: 14px;
      font-weight: 800;
    }

    .duel {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;
    }


    /* =========================
       保存結果一覧
    ========================= */

    .history {
      display: grid;

      gap: 9px;
    }

    .history-item {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 8px;

      padding: 10px;

      border:
        1px solid
        #eee7ec;

      border-radius: 13px;

      background: white;
    }

    .history-item small {
      color: #999;
    }


    @media (max-width: 360px) {

      .app {
        padding-left: 9px;
        padding-right: 9px;
      }

      .name {
        font-size: 13px;
      }

      .info {
        height: 49px;
      }

      .panel h2 {
        font-size: 14px;
      }

    }

  </style>
</head>


<body>

  <div
    class="app"
    id="app"
  ></div>


  <script src="members.js"></script>


  <script>

    const app =
      document.querySelector("#app");


    const SAVE_KEY =
      "takarazukaTop9StateV3";

    const HISTORY_KEY =
      "takarazukaTop9HistoryV3";


    function freshState() {

      return {

        stage: "home",

        order: [],

        page: 0,

        prelim: [],

        pool: [],

        select: [],

        target: null,

        rankPool: [],

        ranked: [],

        insertIndex: 0,

        comparePos: 0,

        result: null

      };

    }


    function loadState() {

      try {

        const saved =
          JSON.parse(
            localStorage.getItem(
              SAVE_KEY
            ) || "{}"
          );

        return {
          ...freshState(),
          ...saved
        };

      }

      catch {

        return freshState();

      }

    }


    let state =
      loadState();


    function saveState() {

      localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(state)
      );

    }


    function memberById(id) {

      return MEMBERS.find(
        member =>
          member.id === id
      );

    }


    function shuffle(array) {

      const result =
        [...array];

      for (
        let i =
          result.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );

        [
          result[i],
          result[j]
        ] =
        [
          result[j],
          result[i]
        ];

      }

      return result;

    }


    function escapeHTML(value) {

      return String(value)
        .replace(
          /[&<>"']/g,
          character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#39;"
          })[character]
        );

    }


    function progressHeader(active) {

      const labels = [
        "予選",
        "50人",
        "20人",
        "9人",
        "結果"
      ];

      return `

        <header>

          <h1>
            <span class="spark">✧</span>
            宝塚好き顔
            <span class="nine">9</span>選
            <span class="spark">✧</span>
          </h1>

        </header>


        <div class="steps">

          ${labels.map(
            (label, index) => `

              <div
                class="
                  step
                  ${
                    index + 1 <= active
                    ? "on"
                    : ""
                  }
                "
              >

                <div class="dot">
                  ${index + 1}
                </div>

                ${label}

              </div>

            `
          ).join("")}

        </div>

      `;

    }


    function personCard(
      member,
      selected = false,
      onclick = ""
    ) {

      return `

        <div
          class="
            card
            ${
              selected
              ? "selected"
              : ""
            }
          "

          ${
            onclick
            ? `onclick="${onclick}"`
            : ""
          }
        >

          <div class="photo">

            <img
              src="${member.image}"
              alt="${escapeHTML(member.name)}"

              onerror="
                this.style.opacity='.15'
              "
            >

          </div>


          <div class="check"></div>


          <div class="info">

            <div
              class="group"
              style="
                color:
                ${member.color}
              "
            >

              ${escapeHTML(member.group)}

            </div>


            <div class="name">

              ${escapeHTML(member.name)}

            </div>

          </div>

        </div>

      `;

    }


    /* =========================
       ホーム
    ========================= */


    function renderHome() {

      let history = [];

      try {

        history =
          JSON.parse(
            localStorage.getItem(
              HISTORY_KEY
            ) || "[]"
          );

      }

      catch {}


      const hasProgress =
        state.stage !== "home" &&
        state.stage !== "result";


      app.innerHTML =

        progressHeader(1)

        +

        `

        <div class="start-card">

          <h2>
            あなたの「好き」を9人に♡
          </h2>

          <p>

            391人から好きな顔を選んで、

            <br>

            50人 → 20人 → 9人へ。

            <br>

            途中経過はこの端末に
            自動保存されます。

          </p>


          <div class="menu">

            ${
              hasProgress

              ?

              `

              <button
                class="primary"
                onclick="render()"
              >

                続きから

              </button>

              `

              :

              ""
            }


            <button
              class="primary"
              onclick="startGame()"
            >

              ${
                hasProgress

                ?

                "最初からやり直す"

                :

                "はじめる"
              }

            </button>


            ${
              history.length

              ?

              `

              <button
                class="secondary"
                onclick="showHistory()"
              >

                保存した結果を見る
                （${history.length}件）

              </button>

              `

              :

              ""
            }

          </div>

        </div>

        `;

    }


    function startGame() {

      state =
        freshState();

      state.stage =
        "prelim";

      state.order =
        shuffle(
          MEMBERS.map(
            member =>
              member.id
          )
        );

      saveState();

      render();

    }


    /* =========================
       予選
    ========================= */


    function renderPreliminary() {

      const start =
        state.page * 4;

      const ids =
        state.order.slice(
          start,
          start + 4
        );

      const selected =
        new Set(
          state.prelim
        );


      app.innerHTML =

        progressHeader(1)

        +

        `

        <div class="panel">

          <div>

            <span class="badge">
              予選
            </span>

            <h2>
              好きな人を選んでください
            </h2>

          </div>


          <div class="stats">

            391人中

            <b>
              ${
                Math.min(
                  start + 1,
                  391
                )
              }
              〜
              ${
                Math.min(
                  start +
                  ids.length,
                  391
                )
              }人目
            </b>

            選択
            ${state.prelim.length}人

          </div>

        </div>


        <div class="cards">

          ${ids.map(
            id => {

              const member =
                memberById(id);

              return personCard(
                member,
                selected.has(id),
                `togglePreliminary(${id})`
              );

            }
          ).join("")}

        </div>


        <div class="actions">

          <button
            class="primary"
            onclick="nextPreliminary()"
          >

            ${
              state.page >=
              Math.ceil(391 / 4) - 1

              ?

              "予選を終了"

              :

              "選択して次へ"
            }

            ›

          </button>


          <div class="row">

            <button
              class="secondary"

              ${
                state.page === 0
                ? "disabled"
                : ""
              }

              onclick="
                previousPreliminary()
              "
            >

              ‹ 前の4人

            </button>


            <button
              class="secondary"

              onclick="
                nextPreliminary()
              "
            >

              この${ids.length}人は
              選ばない

            </button>

          </div>

        </div>

        `;

    }


    function togglePreliminary(id) {

      const selected =
        new Set(
          state.prelim
        );


      if (
        selected.has(id)
      ) {

        selected.delete(id);

      }

      else {

        selected.add(id);

      }


      state.prelim =
        [...selected];


      saveState();

      renderPreliminary();

    }


    function previousPreliminary() {

      if (
        state.page > 0
      ) {

        state.page--;

        saveState();

        renderPreliminary();

      }

    }


    function nextPreliminary() {

      const lastPage =
        Math.ceil(
          391 / 4
        ) - 1;


      if (
        state.page <
        lastPage
      ) {

        state.page++;

        saveState();

        renderPreliminary();

        return;

      }


      if (
        state.prelim.length < 9
      ) {

        alert(
          "9人以上選んでね！"
        );

        return;

      }


      beginNarrowing(
        state.prelim
      );

    }


    /* =========================
       50 → 20 → 9
    ========================= */


    function beginNarrowing(ids) {

      state.pool =
        [...ids];

      state.select =
        [];

      state.page =
        0;


      if (
        ids.length > 50
      ) {

        state.target = 50;

        state.stage =
          "narrow";

      }

      else if (
        ids.length > 20
      ) {

        state.target = 20;

        state.stage =
          "narrow";

      }

      else if (
        ids.length > 9
      ) {

        state.target = 9;

        state.stage =
          "narrow";

      }

      else {

        startRanking(ids);

        return;

      }


      saveState();

      renderNarrowing();

    }


    function narrowingStep() {

      if (
        state.target === 50
      ) {

        return 2;

      }

      if (
        state.target === 20
      ) {

        return 3;

      }

      return 4;

    }


    function renderNarrowing() {

      const start =
        state.page * 4;

      const ids =
        state.pool.slice(
          start,
          start + 4
        );

      const selected =
        new Set(
          state.select
        );

      const totalPages =
        Math.ceil(
          state.pool.length / 4
        );


      app.innerHTML =

        progressHeader(
          narrowingStep()
        )

        +

        `

        <div class="panel">

          <div>

            <span class="badge">

              ${state.target}人選出

            </span>


            <h2>

              ${state.pool.length}人から
              ${state.target}人を選んでください

            </h2>

          </div>


          <div class="stats">

            選択中

            <b>

              ${state.select.length}
              /
              ${state.target}

            </b>

            ${state.page + 1}
            /
            ${totalPages}
            ページ

          </div>

        </div>


        <div class="cards">

          ${ids.map(
            id => {

              const member =
                memberById(id);

              return personCard(
                member,
                selected.has(id),
                `toggleNarrowing(${id})`
              );

            }
          ).join("")}

        </div>


        <div class="actions">

          <button
            class="primary"

            ${
              state.select.length
              !==
              state.target

              ?

              "disabled"

              :

              ""
            }

            onclick="
              finishNarrowing()
            "
          >

            この${state.target}人で決定

          </button>


          <div class="row">

            <button
              class="secondary"

              ${
                state.page === 0
                ? "disabled"
                : ""
              }

              onclick="
                moveNarrowing(-1)
              "
            >

              ‹ 前の4人

            </button>


            <button
              class="secondary"

              ${
                state.page >=
                totalPages - 1

                ?

                "disabled"

                :

                ""
              }

              onclick="
                moveNarrowing(1)
              "
            >

              次の4人 ›

            </button>

          </div>

        </div>

        `;

    }


    function toggleNarrowing(id) {

      const selected =
        new Set(
          state.select
        );


      if (
        selected.has(id)
      ) {

        selected.delete(id);

      }

      else {

        if (
          selected.size >=
          state.target
        ) {

          alert(
            `${state.target}人までだよ！`
          );

          return;

        }

        selected.add(id);

      }


      state.select =
        [...selected];


      saveState();

      renderNarrowing();

    }


    function moveNarrowing(amount) {

      state.page +=
        amount;

      saveState();

      renderNarrowing();

    }


    function finishNarrowing() {

      if (
        state.select.length
        !==
        state.target
      ) {

        return;

      }


      beginNarrowing(
        state.select
      );

    }


    /* =========================
       最終9人 順位決定
    ========================= */


    function startRanking(ids) {

      if (
        ids.length !== 9
      ) {

        beginNarrowing(ids);

        return;

      }


      state.stage =
        "rank";

      state.rankPool =
        shuffle(ids);

      state.ranked =
        [
          state.rankPool[0]
        ];

      state.insertIndex =
        1;

      state.comparePos =
        0;


      saveState();

      renderRanking();

    }


    function renderRanking() {

      if (
        state.insertIndex >=
        state.rankPool.length
      ) {

        finishResult();

        return;

      }


      const challenger =
        state.rankPool[
          state.insertIndex
        ];


      const opponent =
        state.ranked[
          state.comparePos
        ];


      app.innerHTML =

        progressHeader(4)

        +

        `

        <div class="panel">

          <div>

            <span class="badge">
              順位決定
            </span>

            <h2>
              より好きな顔を選んでください
            </h2>

          </div>


          <div class="stats">

            順位づけ

            <b>
              ${state.insertIndex + 1}
              /
              9
            </b>

          </div>

        </div>


        <div class="duel-title">

          どっちがより好き？

        </div>


        <div class="duel">

          ${personCard(
            memberById(challenger),
            false,
            `chooseDuel(${challenger})`
          )}


          ${personCard(
            memberById(opponent),
            false,
            `chooseDuel(${opponent})`
          )}

        </div>


        <div class="notice">

          タップした方を
          上位として並べていきます

        </div>

        `;

    }


    function chooseDuel(id) {

      const challenger =
        state.rankPool[
          state.insertIndex
        ];


      if (
        id === challenger
      ) {

        state.ranked.splice(
          state.comparePos,
          0,
          challenger
        );

        state.insertIndex++;

        state.comparePos =
          0;

      }

      else {

        if (
          state.comparePos >=
          state.ranked.length - 1
        ) {

          state.ranked.push(
            challenger
          );

          state.insertIndex++;

          state.comparePos =
            0;

        }

        else {

          state.comparePos++;

        }

      }


      saveState();

      renderRanking();

    }


    /* =========================
       結果
    ========================= */


    function finishResult() {

      state.result =
        [...state.ranked];

      state.stage =
        "result";


      let history = [];

      try {

        history =
          JSON.parse(
            localStorage.getItem(
              HISTORY_KEY
            ) || "[]"
          );

      }

      catch {}


      history.unshift({

        id:
          Date.now(),

        date:
          new Date()
            .toLocaleString(
              "ja-JP"
            ),

        result:
          [...state.result]

      });


      localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(
          history.slice(
            0,
            20
          )
        )
      );


      saveState();

      renderResult();

    }


    function rankCard(
      member,
      index
    ) {

      let medalClass = "";

      if (
        index === 0
      ) {

        medalClass =
          "gold";

      }

      else if (
        index === 1
      ) {

        medalClass =
          "silver";

      }

      else if (
        index === 2
      ) {

        medalClass =
          "bronze";

      }


      return `

        <div
          class="
            rank-card
            ${medalClass}
          "
        >

          <div class="rank-no">

            ${index + 1}

          </div>


          <div class="photo">

            <img
              src="${member.image}"
              alt="${escapeHTML(member.name)}"
            >

          </div>


          <div class="info">

            <div
              class="group"

              style="
                color:
                ${member.color}
              "
            >

              ${escapeHTML(member.group)}

            </div>


            <div class="name">

              ${escapeHTML(member.name)}

            </div>

          </div>

        </div>

      `;

    }


    function renderResult(
      resultIds =
        state.result
    ) {

      if (
        !resultIds
      ) {

        renderHome();

        return;

      }


      app.innerHTML =

        progressHeader(5)

        +

        `

        <div class="panel">

          <div>

            <span class="badge">
              完成♡
            </span>

            <h2>
              あなたの宝塚好き顔 9選
            </h2>

          </div>


          <div class="stats">

            TOP

            <b>
              9
            </b>

          </div>

        </div>


        <div class="rank-grid">

          ${resultIds.map(
            (id, index) =>

              rankCard(
                memberById(id),
                index
              )

          ).join("")}

        </div>


        <div class="actions">

          <button
            class="primary"
            onclick="saveResultImage()"
          >

            画像を保存する

          </button>


          <div class="row">

            <button
              class="secondary"
              onclick="shareResultImage()"
            >

              シェアする

            </button>


            <button
              class="secondary"
              onclick="goHome()"
            >

              トップへ戻る

            </button>

          </div>

        </div>

        `;

    }


    function goHome() {

      state =
        freshState();

      saveState();

      renderHome();

    }


    /* =========================
       過去結果
    ========================= */


    function showHistory() {

      let history = [];

      try {

        history =
          JSON.parse(
            localStorage.getItem(
              HISTORY_KEY
            ) || "[]"
          );

      }

      catch {}


      app.innerHTML =

        progressHeader(5)

        +

        `

        <div class="panel">

          <div>

            <span class="badge">
              保存済み
            </span>

            <h2>
              過去の結果
            </h2>

          </div>

        </div>


        <div class="history">

          ${
            history.length

            ?

            history.map(
              (item, index) => {

                const first =
                  memberById(
                    item.result[0]
                  );

                return `

                  <div
                    class="history-item"
                  >

                    <div>

                      <b>

                        ${
                          first
                          ?
                          escapeHTML(
                            first.name
                          )
                          :
                          "結果"
                        }

                      </b>

                      <br>

                      <small>

                        ${
                          escapeHTML(
                            item.date
                          )
                        }

                      </small>

                    </div>


                    <button
                      class="secondary"

                      style="
                        width:auto;
                      "

                      onclick="
                        openHistory(
                          ${index}
                        )
                      "
                    >

                      この結果を見る

                    </button>

                  </div>

                `;

              }
            ).join("")

            :

            `

              <div class="notice">

                まだ結果はありません

              </div>

            `
          }

        </div>


        <div class="actions">

          <button
            class="secondary"
            onclick="renderHome()"
          >

            戻る

          </button>

        </div>

        `;

    }


    function openHistory(index) {

      const history =
        JSON.parse(
          localStorage.getItem(
            HISTORY_KEY
          ) || "[]"
        );


      renderResult(
        history[index].result
      );

    }


    /* =========================
       結果画像を作る
    ========================= */


    function loadImage(src) {

      return new Promise(
        (
          resolve,
          reject
        ) => {

          const image =
            new Image();


          image.onload =
            () =>
              resolve(image);


          image.onerror =
            reject;


          image.src =
            src;

        }
      );

    }


    function roundedRectangle(
      context,
      x,
      y,
      width,
      height,
      radius,
      fill,
      stroke
    ) {

      context.beginPath();

      context.roundRect(
        x,
        y,
        width,
        height,
        radius
      );


      if (fill) {

        context.fill();

      }


      if (stroke) {

        context.stroke();

      }

    }


    function drawCover(
      context,
      image,
      x,
      y,
      width,
      height
    ) {

      const scale =
        Math.max(
          width /
          image.width,

          height /
          image.height
        );


      const newWidth =
        image.width *
        scale;


      const newHeight =
        image.height *
        scale;


      context.drawImage(

        image,

        x +
        (
          width -
          newWidth
        ) / 2,

        y +
        (
          height -
          newHeight
        ) / 2,

        newWidth,

        newHeight

      );

    }


    async function makeResultCanvas() {

      const ids =
        state.result;


      const width =
        1080;

      const height =
        1440;


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        width;

      canvas.height =
        height;


      const context =
        canvas.getContext(
          "2d"
        );


      context.fillStyle =
        "#fff9fc";

      context.fillRect(
        0,
        0,
        width,
        height
      );


      context.textAlign =
        "center";


      context.fillStyle =
        "#29293a";


      context.font =
        "800 62px sans-serif";


      context.fillText(
        "宝塚好き顔 9選",
        width / 2,
        95
      );


      const margin =
        54;

      const gap =
        22;


      const cardWidth =
        (
          width -
          margin * 2 -
          gap * 2
        ) / 3;


      const cardHeight =
        380;


      const startY =
        145;


      for (
        let index = 0;
        index < 9;
        index++
      ) {

        const member =
          memberById(
            ids[index]
          );


        const column =
          index % 3;


        const row =
          Math.floor(
            index / 3
          );


        const x =
          margin +
          column *
          (
            cardWidth +
            gap
          );


        const y =
          startY +
          row *
          (
            cardHeight +
            gap
          );


        let borderColor =
          "#e9e4e8";


        if (
          index === 0
        ) {

          borderColor =
            "#d7ad24";

        }

        else if (
          index === 1
        ) {

          borderColor =
            "#aeb6c2";

        }

        else if (
          index === 2
        ) {

          borderColor =
            "#bf7a42";

        }


        context.fillStyle =
          "#ffffff";


        context.strokeStyle =
          borderColor;


        context.lineWidth =
          index < 3
          ? 9
          : 4;


        roundedRectangle(

          context,

          x,
          y,

          cardWidth,
          cardHeight,

          22,

          true,
          true

        );


        try {

          const image =
            await loadImage(
              member.image
            );


          context.save();


          roundedRectangle(

            context,

            x + 5,
            y + 5,

            cardWidth - 10,
            275,

            17,

            false,
            false

          );


          context.clip();


          drawCover(

            context,

            image,

            x + 5,
            y + 5,

            cardWidth - 10,
            275

          );


          context.restore();

        }

        catch {}


        context.fillStyle =
          member.color;


        context.font =
          "800 26px sans-serif";


        context.fillText(

          member.group,

          x +
          cardWidth / 2,

          y + 315

        );


        context.fillStyle =
          "#29293a";


        context.font =
          "800 31px sans-serif";


        context.fillText(

          member.name,

          x +
          cardWidth / 2,

          y + 355

        );


        if (
          index === 0
        ) {

          context.fillStyle =
            "#f5cf49";

        }

        else if (
          index === 1
        ) {

          context.fillStyle =
            "#dce1e7";

        }

        else if (
          index === 2
        ) {

          context.fillStyle =
            "#d99761";

        }

        else {

          context.fillStyle =
            "#f4eff2";

        }


        context.beginPath();

        context.arc(
          x + 32,
          y + 32,
          25,
          0,
          Math.PI * 2
        );

        context.fill();


        context.fillStyle =
          "#29293a";


        context.font =
          "900 25px sans-serif";


        context.fillText(

          String(
            index + 1
          ),

          x + 32,
          y + 41

        );

      }


      context.fillStyle =
        "#a68d99";


      context.font =
        "500 22px sans-serif";


      context.fillText(

        new Date()
          .toLocaleDateString(
            "ja-JP"
          ),

        width / 2,
        height - 28

      );


      return canvas;

    }


    /* =========================
       画像保存
    ========================= */


    async function saveResultImage() {

      const canvas =
        await makeResultCanvas();


      const link =
        document.createElement(
          "a"
        );


      link.download =
        `takarazuka-top9-${Date.now()}.png`;


      link.href =
        canvas.toDataURL(
          "image/png"
        );


      link.click();

    }


    /* =========================
       シェア
    ========================= */


    async function shareResultImage() {

      const canvas =
        await makeResultCanvas();


      canvas.toBlob(

        async blob => {

          const file =
            new File(

              [blob],

              "takarazuka-top9.png",

              {
                type:
                  "image/png"
              }

            );


          if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
              files: [file]
            })
          ) {

            try {

              await navigator.share({

                files: [file],

                title:
                  "宝塚好き顔 9選"

              });

            }

            catch {}

          }

          else {

            const link =
              document.createElement(
                "a"
              );


            link.download =
              file.name;


            link.href =
              URL.createObjectURL(
                blob
              );


            link.click();

          }

        },

        "image/png"

      );

    }


    /* =========================
       表示切り替え
    ========================= */


    function render() {

      if (
        state.stage === "home"
      ) {

        renderHome();

      }

      else if (
        state.stage === "prelim"
      ) {

        renderPreliminary();

      }

      else if (
        state.stage === "narrow"
      ) {

        renderNarrowing();

      }

      else if (
        state.stage === "rank"
      ) {

        renderRanking();

      }

      else if (
        state.stage === "result"
      ) {

        renderResult();

      }

      else {

        renderHome();

      }

    }


    render();

  </script>
