<!doctype html>
<html lang="ja">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#fff8fb"
>

<title>宝塚好き顔 9選</title>

<style>

:root {
  --pink:#ed5f93;
  --pink-light:#ff91b7;
  --text:#29293a;
  --muted:#858596;
}

* {
  box-sizing:border-box;
}

html {
  -webkit-text-size-adjust:100%;
}

body {
  margin:0;
  background:linear-gradient(#fffafd,#ffffff);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
}

button {
  font:inherit;
}

.app {
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:12px 12px 34px;
}


/* =====================
   タイトル
===================== */

header {
  text-align:center;
  margin:3px 0 8px;
}

h1 {
  margin:0;
  font-size:25px;
  font-weight:800;
}

.nine {
  color:var(--pink);
  font-size:1.25em;
}

.spark {
  color:#f5aac3;
}


/* =====================
   進行状況
===================== */

.steps {
  display:flex;
  margin:8px 4px 11px;
}

.step {
  flex:1;
  position:relative;
  text-align:center;
  color:#9a9aa8;
  font-size:9px;
  font-weight:700;
}

.step:not(:last-child)::before {
  content:"";
  position:absolute;
  top:12px;
  left:58%;
  width:84%;
  height:2px;
  background:#e7e4e8;
}

.dot {
  position:relative;
  z-index:1;
  width:25px;
  height:25px;
  margin:0 auto 3px;

  display:grid;
  place-items:center;

  border-radius:50%;
  background:#e8e8ed;
  font-size:11px;
}

.step.on {
  color:var(--pink);
}

.step.on .dot {
  color:white;
  background:var(--pink);
}


/* =====================
   説明パネル
===================== */

.panel {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  margin-bottom:9px;
  padding:9px 11px;

  border-radius:14px;

  background:
    linear-gradient(
      100deg,
      #fff0f6,
      #fff7fa
    );
}

.badge {
  display:inline-block;

  padding:4px 10px;

  border-radius:999px;

  background:var(--pink);
  color:white;

  font-size:10px;
  font-weight:800;
}

.panel h2 {
  margin:5px 0 0;
  font-size:14px;
}

.stats {
  text-align:right;
  white-space:nowrap;
  font-size:9px;
}

.stats b {
  display:block;
  color:var(--pink);
  font-size:16px;
}


/* =====================
   通常カード
===================== */

.cards {
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:8px;
}

.card {
  position:relative;
  min-width:0;
  overflow:hidden;

  border:2px solid transparent;
  border-radius:12px;

  background:white;

  box-shadow:
    0 4px 14px
    rgba(77,53,80,.07);
}

.card.selected {
  border-color:var(--pink);

  box-shadow:
    0 5px 18px
    rgba(237,95,147,.19);
}

.photo {
  aspect-ratio:1 / 1.10;
  overflow:hidden;
  background:#f0edf1;
}

.photo img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.info {
  height:53px;

  padding:5px 4px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  text-align:center;
}

.group {
  font-size:10px;
  font-weight:800;
}

.name {
  margin-top:2px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  font-size:14px;
  font-weight:750;
}

.check {
  position:absolute;

  top:5px;
  right:5px;

  width:23px;
  height:23px;

  display:grid;
  place-items:center;

  border:1.5px solid #777;
  border-radius:50%;

  background:white;
  color:white;

  font-size:13px;
  font-weight:900;
}

.selected .check {
  border-color:white;
  background:var(--pink);
}

.selected .check::after {
  content:"✓";
}


/* =====================
   予選 3×3
===================== */

.preliminary-grid {
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:6px;
}

.preliminary-grid .card {
  border-radius:10px;
}

.preliminary-grid .photo {
  aspect-ratio:1 / 1.12;
}

.preliminary-grid .info {
  height:42px;
  padding:3px 2px;
}

.preliminary-grid .group {
  font-size:8px;
}

.preliminary-grid .name {
  margin-top:1px;
  font-size:10px;
}

.preliminary-grid .check {
  top:4px;
  right:4px;

  width:19px;
  height:19px;

  font-size:11px;
}


/* =====================
   ボタン
===================== */

.actions {
  margin-top:10px;
}

.primary,
.secondary {
  width:100%;
  border:0;
  border-radius:999px;
  font-weight:800;
}

.primary {
  padding:12px;

  background:
    linear-gradient(
      90deg,
      var(--pink-light),
      var(--pink)
    );

  color:white;
  font-size:14px;
}

.primary:disabled {
  opacity:.4;
}

.row {
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;
  margin-top:7px;
}

.secondary {
  padding:9px 5px;

  border:1px solid #e4dfe5;

  background:white;
  color:#737381;

  font-size:11px;
}

.secondary:disabled {
  opacity:.4;
}

.notice {
  margin:9px 0;

  text-align:center;

  color:#8a8790;

  font-size:11px;
}


/* =====================
   ホーム
===================== */

.start-card {
  padding:18px 14px;

  border-radius:18px;

  background:white;

  text-align:center;

  box-shadow:
    0 6px 25px
    rgba(103,74,96,.08);
}

.start-card p {
  color:#777;
  font-size:12px;
  line-height:1.7;
}

.menu {
  display:grid;
  gap:9px;
  margin-top:14px;
}


/* =====================
   2択
===================== */

.duel {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.duel-title {
  margin:8px 0;

  text-align:center;

  font-size:14px;
  font-weight:800;
}


/* =====================
   結果
===================== */

.rank-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.rank-card {
  position:relative;

  overflow:hidden;

  border:2px solid transparent;
  border-radius:11px;

  background:white;
}

.rank-card .photo {
  aspect-ratio:1 / 1.08;
}

.rank-card .info {
  height:48px;
}

.rank-card .name {
  font-size:11px;
}

.rank-card .group {
  font-size:9px;
}

.rank-no {
  position:absolute;
  z-index:2;

  top:4px;
  left:4px;

  min-width:25px;
  height:25px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:white;

  font-size:12px;
  font-weight:900;
}

.rank-card.gold {
  border-color:#d7ad24;
}

.rank-card.gold .rank-no {
  background:#f5cf49;
}

.rank-card.silver {
  border-color:#aeb6c2;
}

.rank-card.silver .rank-no {
  background:#dce1e7;
}

.rank-card.bronze {
  border-color:#bf7a42;
}

.rank-card.bronze .rank-no {
  background:#d99761;
}


/* =====================
   保存画像プレビュー
===================== */

.image-preview {
  position:fixed;
  z-index:9999;

  inset:0;

  padding:20px 14px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  background:rgba(20,20,30,.92);
}

.image-preview img {
  display:block;

  width:100%;
  max-width:440px;
  max-height:75vh;

  margin:auto;

  object-fit:contain;

  border-radius:12px;
}

.preview-text {
  margin:12px 0 8px;

  color:white;

  text-align:center;

  font-size:13px;
  line-height:1.6;
}

.preview-buttons {
  width:100%;
  max-width:440px;
  margin:auto;
}


/* =====================
   履歴
===================== */

.history {
  display:grid;
  gap:9px;
}

.history-item {
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:8px;

  padding:10px;

  border:1px solid #eee7ec;
  border-radius:13px;

  background:white;
}

.history-item small {
  color:#999;
}

</style>
</head>


<body>

<div
  class="app"
  id="app"
></div>

<script src="members.js"></script>

<script>

const app =
  document.querySelector("#app");


const SAVE_KEY =
  "takarazukaTop9StateV5";


const HISTORY_KEY =
  "takarazukaTop9HistoryV4";


const PRELIMINARY_SIZE =
  9;


const NARROW_SIZE =
  4;


/* =====================
   状態
===================== */

function freshState() {

  return {

    stage:"home",

    order:[],

    page:0,

    prelim:[],

    pool:[],

    select:[],

    target:null,

    rankPool:[],

    ranked:[],

    insertIndex:0,

    comparePos:0,

    result:null

  };

}


function loadState() {

  try {

    return {

      ...freshState(),

      ...JSON.parse(
        localStorage.getItem(
          SAVE_KEY
        ) || "{}"
      )

    };

  }

  catch {

    return freshState();

  }

}


let state =
  loadState();


function saveState() {

  localStorage.setItem(

    SAVE_KEY,

    JSON.stringify(state)

  );

}


/* =====================
   基本
===================== */

function memberById(id) {

  return MEMBERS.find(
    member =>
      member.id === id
  );

}


function shuffle(array) {

  const result =
    [...array];


  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}


function escapeHTML(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        "\"":"&quot;",

        "'":"&#39;"

      })[character]
    );

}


/* =====================
   ヘッダー
===================== */

function progressHeader(active) {

  const labels = [

    "予選",

    "50人",

    "20人",

    "順位",

    "結果"

  ];


  return `

  <header>

    <h1>

      <span class="spark">
        ✧
      </span>

      宝塚好き顔

      <span class="nine">
        9
      </span>

      選

      <span class="spark">
        ✧
      </span>

    </h1>

  </header>


  <div class="steps">

    ${labels.map(

      (label,index) => `

      <div
        class="
          step
          ${
            index + 1 <= active
            ? "on"
            : ""
          }
        "
      >

        <div class="dot">
          ${index + 1}
        </div>

        ${label}

      </div>

      `

    ).join("")}

  </div>

  `;

}


/* =====================
   人物カード
===================== */

function personCard(

  member,

  selected = false,

  onclick = ""

) {

  return `

  <div

    class="
      card
      ${
        selected
        ? "selected"
        : ""
      }
    "

    ${
      onclick
      ? `onclick="${onclick}"`
      : ""
    }

  >

    <div class="photo">

      <img

        src="${member.image}"

        alt="${escapeHTML(member.name)}"

        onerror="
          this.style.opacity='.15'
        "

      >

    </div>


    <div class="check"></div>


    <div class="info">

      <div

        class="group"

        style="
          color:
          ${member.color}
        "

      >

        ${escapeHTML(member.group)}

      </div>


      <div class="name">

        ${escapeHTML(member.name)}

      </div>

    </div>

  </div>

  `;

}


/* =====================
   ホーム
===================== */

function renderHome() {

  let history = [];


  try {

    history =
      JSON.parse(
        localStorage.getItem(
          HISTORY_KEY
        ) || "[]"
      );

  }

  catch {}


  const hasProgress =

    state.stage !== "home"

    &&

    state.stage !== "result";


  app.innerHTML =

    progressHeader(1)

    +

    `

    <div class="start-card">

      <h2>
        あなたの「好き」を9人に♡
      </h2>


      <p>

        391人から好きな顔を選んで、

        <br>

        50人 → 20人へ。

        <br>

        最後は20人を2択で比べて

        <br>

        TOP9を決めます。

        <br>

        予選は9人ずつ表示されます。

        <br>

        途中経過は自動保存されます。

      </p>


      <div class="menu">


        ${
          hasProgress

          ?

          `

          <button
            class="primary"
            onclick="render()"
          >

            続きから

          </button>

          `

          :

          ""
        }


        <button
          class="primary"
          onclick="startGame()"
        >

          ${
            hasProgress

            ?

            "最初からやり直す"

            :

            "はじめる"
          }

        </button>


        ${
          history.length

          ?

          `

          <button
            class="secondary"
            onclick="showHistory()"
          >

            保存した結果を見る
            （${history.length}件）

          </button>

          `

          :

          ""
        }


      </div>

    </div>

    `;

}


/* =====================
   スタート
===================== */

function startGame() {

  state =
    freshState();


  state.stage =
    "prelim";


  state.order =
    shuffle(
      MEMBERS.map(
        member =>
          member.id
      )
    );


  saveState();


  render();

}


/* =====================
   予選
===================== */

function renderPreliminary() {

  const start =

    state.page *
    PRELIMINARY_SIZE;


  const ids =

    state.order.slice(

      start,

      start +
      PRELIMINARY_SIZE

    );


  const selected =

    new Set(
      state.prelim
    );


  const totalPages =

    Math.ceil(

      MEMBERS.length /

      PRELIMINARY_SIZE

    );


  app.innerHTML =

    progressHeader(1)

    +

    `

    <div class="panel">

      <div>

        <span class="badge">
          予選
        </span>

        <h2>
          好きな人を選んでください
        </h2>

      </div>


      <div class="stats">

        ${state.page + 1}
        /
        ${totalPages}
        ページ

        <b>

          選択
          ${state.prelim.length}人

        </b>

      </div>

    </div>


    <div class="preliminary-grid">

      ${ids.map(

        id =>

          personCard(

            memberById(id),

            selected.has(id),

            `togglePreliminary(${id})`

          )

      ).join("")}

    </div>


    <div class="actions">


      <button

        class="primary"

        onclick="
          nextPreliminary()
        "

      >

        ${
          state.page >=
          totalPages - 1

          ?

          "予選を終了"

          :

          "選択して次の9人へ"
        }

        ›

      </button>


      <div class="row">


        <button

          class="secondary"

          ${
            state.page === 0
            ? "disabled"
            : ""
          }

          onclick="
            previousPreliminary()
          "

        >

          ‹ 前の9人

        </button>


        <button

          class="secondary"

          onclick="
            nextPreliminary()
          "

        >

          この${ids.length}人は
          選ばない

        </button>


      </div>

    </div>

    `;


  preloadNextPreliminary();

}


function togglePreliminary(id) {

  const selected =

    new Set(
      state.prelim
    );


  if (
    selected.has(id)
  ) {

    selected.delete(id);

  }

  else {

    selected.add(id);

  }


  state.prelim =
    [...selected];


  saveState();


  renderPreliminary();

}


function previousPreliminary() {

  if (
    state.page > 0
  ) {

    state.page--;


    saveState();


    renderPreliminary();

  }

}


function preloadNextPreliminary() {

  const nextStart =

    (state.page + 1) *
    PRELIMINARY_SIZE;


  const nextIds =

    state.order.slice(

      nextStart,

      nextStart +
      PRELIMINARY_SIZE

    );


  nextIds.forEach(id => {

    const member =
      memberById(id);


    if (!member) {
      return;
    }


    const image =
      new Image();


    image.src =
      member.image;

  });

}


function nextPreliminary() {

  const totalPages =

    Math.ceil(

      MEMBERS.length /

      PRELIMINARY_SIZE

    );


  if (
    state.page <
    totalPages - 1
  ) {

    state.page++;


    saveState();


    renderPreliminary();


    return;

  }


  if (
    state.prelim.length < 9
  ) {

    alert(
      "9人以上選んでね！"
    );


    return;

  }


  beginNarrowing(
    state.prelim
  );

}


/* =====================
   50人 → 20人
===================== */

function beginNarrowing(ids) {

  state.pool =
    [...ids];


  state.select =
    [];


  state.page =
    0;


  if (
    ids.length > 50
  ) {

    state.target =
      50;


    state.stage =
      "narrow";

  }


  else if (
    ids.length > 20
  ) {

    state.target =
      20;


    state.stage =
      "narrow";

  }


  else {

    startRanking(ids);

    return;

  }


  saveState();


  renderNarrowing();

}


function narrowingStep() {

  if (
    state.target === 50
  ) {

    return 2;

  }


  return 3;

}


function renderNarrowing() {

  const start =

    state.page *
    NARROW_SIZE;


  const ids =

    state.pool.slice(

      start,

      start +
      NARROW_SIZE

    );


  const selected =

    new Set(
      state.select
    );


  const totalPages =

    Math.ceil(

      state.pool.length /
      NARROW_SIZE

    );


  app.innerHTML =

    progressHeader(
      narrowingStep()
    )

    +

    `

    <div class="panel">

      <div>

        <span class="badge">

          ${state.target}人選出

        </span>

        <h2>

          ${state.pool.length}人から
          ${state.target}人を選んでください

        </h2>

      </div>


      <div class="stats">

        選択中

        <b>

          ${state.select.length}
          /
          ${state.target}

        </b>

        ${state.page + 1}
        /
        ${totalPages}

      </div>

    </div>


    <div class="cards">

      ${ids.map(

        id =>

          personCard(

            memberById(id),

            selected.has(id),

            `toggleNarrowing(${id})`

          )

      ).join("")}

    </div>


    <div class="actions">


      <button

        class="primary"

        ${
          state.select.length
          !==
          state.target

          ?

          "disabled"

          :

          ""
        }

        onclick="
          finishNarrowing()
        "

      >

        この${state.target}人で決定

      </button>


      <div class="row">


        <button

          class="secondary"

          ${
            state.page === 0
            ? "disabled"
            : ""
          }

          onclick="
            moveNarrowing(-1)
          "

        >

          ‹ 前の4人

        </button>


        <button

          class="secondary"

          ${
            state.page >=
            totalPages - 1

            ?

            "disabled"

            :

            ""
          }

          onclick="
            moveNarrowing(1)
          "

        >

          次の4人 ›

        </button>


      </div>

    </div>

    `;

}


function toggleNarrowing(id) {

  const selected =

    new Set(
      state.select
    );


  if (
    selected.has(id)
  ) {

    selected.delete(id);

  }


  else {

    if (
      selected.size >=
      state.target
    ) {

      alert(
        `${state.target}人までだよ！`
      );


      return;

    }


    selected.add(id);

  }


  state.select =
    [...selected];


  saveState();


  renderNarrowing();

}


function moveNarrowing(amount) {

  state.page +=
    amount;


  saveState();


  renderNarrowing();

}


function finishNarrowing() {

  if (
    state.select.length
    !==
    state.target
  ) {

    return;

  }


  beginNarrowing(
    state.select
  );

}


/* =====================
   20人から2択順位決定
===================== */

function startRanking(ids) {

  if (
    ids.length < 9
  ) {

    alert(
      "TOP9を決めるため、9人以上必要です。"
    );

    return;

  }


  state.stage =
    "rank";


  state.rankPool =
    shuffle(ids);


  state.ranked =
    [
      state.rankPool[0]
    ];


  state.insertIndex =
    1;


  state.comparePos =
    0;


  saveState();


  renderRanking();

}


function renderRanking() {

  if (
    state.insertIndex >=
    state.rankPool.length
  ) {

    finishResult();

    return;

  }


  const challenger =

    state.rankPool[
      state.insertIndex
    ];


  const opponent =

    state.ranked[

function chooseDuel(id) {

  const challenger =

    state.rankPool[
      state.insertIndex
    ];


  if (
    id === challenger
  ) {

    state.ranked.splice(

      state.comparePos,

      0,

      challenger

    );


    state.insertIndex++;


    state.comparePos =
      0;

  }


  else if (

    state.comparePos >=
    state.ranked.length - 1

  ) {

    state.ranked.push(
      challenger
    );


    state.insertIndex++;


    state.comparePos =
      0;

  }


  else {

    state.comparePos++;

  }


  saveState();


  renderRanking();

}

function loadImage(src) {

  return new Promise(

    (
      resolve,
      reject
    ) => {

      const image =
        new Image();


      image.onload =
        () =>
          resolve(image);


      image.onerror =
        reject;


      image.src =
        src;

    }

  );

}


/* =====================
   Canvas補助
===================== */

function roundedRectangle(

  context,

  x,

  y,

  width,

  height,

  radius,

  fill,

  stroke

) {

  context.beginPath();


  if (
    context.roundRect
  ) {

    context.roundRect(

      x,
      y,

      width,
      height,

      radius

    );

  }

  else {

    context.moveTo(
      x + radius,
      y
    );


    context.lineTo(
      x + width - radius,
      y
    );


    context.quadraticCurveTo(

      x + width,
      y,

      x + width,
      y + radius

    );


    context.lineTo(

      x + width,
      y + height - radius

    );


    context.quadraticCurveTo(

      x + width,
      y + height,

      x + width - radius,
      y + height

    );


    context.lineTo(
      x + radius,
      y + height
    );


    context.quadraticCurveTo(

      x,
      y + height,

      x,
      y + height - radius

    );


    context.lineTo(
      x,
      y + radius
    );


    context.quadraticCurveTo(

      x,
      y,

      x + radius,
      y

    );


    context.closePath();

  }


  if (fill) {
    context.fill();
  }


  if (stroke) {
    context.stroke();
  }

}


function drawCover(

  context,

  image,

  x,

  y,

  width,

  height

) {

  const scale =

    Math.max(

      width /
      image.width,

      height /
      image.height

    );


  const newWidth =
    image.width *
    scale;


  const newHeight =
    image.height *
    scale;


  context.drawImage(

    image,

    x +
    (
      width -
      newWidth
    ) / 2,

    y +
    (
      height -
      newHeight
    ) / 2,

    newWidth,

    newHeight

  );

}

let preparedImageFile =
  null;


let preparedImageURL =
  null;


async function prepareResultImage() {

  try {

    const canvas =

      await makeResultCanvas(
        state.result
      );


    const blob =

      await new Promise(

        resolve =>

          canvas.toBlob(

            resolve,

            "image/png"

          )

      );


    if (!blob) {

      throw new Error(
        "画像を作成できませんでした"
      );

    }


    preparedImageFile =

      new File(

        [blob],

        "takarazuka-top9.png",

        {
          type:"image/png"
        }

      );


    if (
      preparedImageURL
    ) {

      URL.revokeObjectURL(
        preparedImageURL
      );

    }


    preparedImageURL =

      URL.createObjectURL(
        blob
      );


    showImagePreview();

  }

  catch (error) {

    alert(
      "画像の作成に失敗しました。"
    );


    console.error(
      error
    );

  }

}


function showImagePreview() {

  const overlay =

    document.createElement(
      "div"
    );


  overlay.className =
    "image-preview";


  overlay.innerHTML = `

    <img

      src="${preparedImageURL}"

      alt="宝塚好き顔9選"

    >


    <div class="preview-text">

      画像ができました♡

      <br>

      iPhoneは下のボタンから
      「画像を保存」を選べます。

      <br>

      うまくいかない場合は
      上の画像を長押しして保存してね。

    </div>


    <div class="preview-buttons">

      <button

        class="primary"

        onclick="
          sharePreparedImage()
        "

      >

        共有して保存

      </button>


      <button

        class="secondary"

        style="
          margin-top:8px;
        "

        onclick="
          closeImagePreview()
        "

      >

        閉じる

      </button>

    </div>

  `;


  document.body.appendChild(
    overlay
  );

}


async function sharePreparedImage() {

  if (
    !preparedImageFile
  ) {

    return;

  }


  if (

    navigator.share

    &&

    (

      !navigator.canShare

      ||

      navigator.canShare({

        files:[
          preparedImageFile
        ]

      })

    )

  ) {

    try {

      await navigator.share({

        files:[
          preparedImageFile
        ],

        title:
          "宝塚好き顔 9選"

      });


      return;

    }

    catch (error) {

      if (

        error.name ===
        "AbortError"

      ) {

        return;

      }

    }

  }


  alert(
    "上の画像を長押しして「写真に保存」を選んでね！"
  );

}


function closeImagePreview() {

  const preview =

    document.querySelector(
      ".image-preview"
    );


  if (preview) {

    preview.remove();

  }

}

    state.stage === "rank"
  ) {

    renderRanking();

  }


  else if (
    state.stage === "result"
  ) {

    renderResult();

  }


  else {

    renderHome();

  }

}


render();

</script>

</body>

</html>
